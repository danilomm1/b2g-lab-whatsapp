[project]
name = "b2g-integrations-lab"
version = "0.1.0"
description = "Laboratório de integrações entre os canais digitais da Brave2Grow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.11",
    "huey>=2.5",
    "httpx>=0.27",
    "django-tailwind-cli>=4.8",
    "django-htmx>=1.29",
    "cryptography>=46",
    "phonenumbers>=9.0",
]

[project.optional-dependencies]
# Servidor de validação na EC2 (deploy/deploy.sh)
prod = [
    "gunicorn>=23",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "respx>=0.21",
    "ruff>=0.6",
    # Só para conectar no Chrome de depuração (porta 9997); não baixa navegadores
    "playwright>=1.64",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]
